[DEFAULT]
pristine-tar = True
debian-branch = debian/latest
upstream-branch = upstream/latest
sign-tags = True

[import-orig]
filter = [
  'Android.mk',
  'android-project',
  'src/hidapi/*/*.sln',
  'src/hidapi/*/*.vcproj',
  'src/hidapi/documentation/*.png',
  'src/render/metal/SDL_shaders_metal_*.h',
  'test/gamepad_*.h',
  'test/unifont-*',
  'VisualC',
  'VisualC-GDK',
  'VisualC-WinRT',
  'Xcode',
  ]
filter-pristine-tar = True
